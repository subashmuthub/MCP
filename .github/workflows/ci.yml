name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  backend-check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' || exit 1" \
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend deps
        run: npm ci --prefix backend
      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB service..."
          sleep 8
      - name: Run backend tests
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017/equipsense_ai'
        run: npm test --prefix backend
      - name: Run backend lint (if configured)
        run: |
          if npm --prefix backend run lint --silent; then
            echo "lint ok";
          else
            echo "no lint script or lint failed";
          fi
      - name: Docker Compose smoke test (optional)
        if: false
        run: |
          docker-compose -f docker-compose.yml up -d --build
          sleep 5
          curl --fail http://localhost:4000/health
          docker-compose down

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images with docker-compose
        run: |
          docker compose -f docker-compose.yml build --progress=plain
      - name: Start services
        run: |
          docker compose -f docker-compose.yml up -d
      - name: Wait for services
        run: |
          sleep 6
      - name: Check backend health
        run: |
          curl --fail http://localhost:4000/health
      - name: Check ML service health
        run: |
          curl --fail http://localhost:5001/health
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v
